<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GeoPhysAI v8 — Intelligent Geophysical Interpretation System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ── reset ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d0f;--surf:#0d1a1e;--panel:#111f24;--bdr:#1a3540;
  --acc:#00e5b0;--accD:#007a5e;
  --amb:#f5a623;--red:#ff4d4d;--blu:#38bdf8;
  --txt:#c8e6ea;--mut:#5a7f88;--grid:#0f2830;
  --pur:#c084fc;--grn:#00c853;--org:#fb923c;--pnk:#f472b6;
}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono','Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}

/* ── header (exact original style) ── */
#hdr{border-bottom:1px solid var(--bdr);background:var(--surf);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo-wrap{display:flex;align-items:center;gap:14px}
.logo-icon{width:36px;height:36px;border-radius:6px;background:linear-gradient(135deg,rgba(0,229,176,.18),rgba(0,122,94,.38));border:1px solid var(--accD);display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-name{font-size:16px;color:var(--acc);letter-spacing:3px;font-weight:700}.logo-name span{color:var(--txt)}
.logo-sub{font-size:10px;color:var(--mut);letter-spacing:2px;margin-top:2px}
.badge{font-size:10px;font-family:monospace;letter-spacing:2px;border:1px solid;border-radius:2px;padding:2px 6px;text-transform:uppercase;opacity:.9}

/* ── tabs ── */
#tabs{display:flex;background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 28px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#tabs::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:13px 16px;cursor:pointer;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:inherit;color:var(--mut);white-space:nowrap;transition:all .15s}
.tab-btn:hover:not(.tab-on){color:var(--txt)}
.tab-on{border-bottom-color:var(--tc);color:var(--tc);background:linear-gradient(180deg,rgba(255,255,255,.04) 0%,transparent 100%)}

/* ── page body ── */
#body{flex:1;padding:22px 28px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}

/* ── method header ── */
.mhdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.mhdr-title{font-size:18px;font-weight:700;letter-spacing:1px}
.mhdr-sub{font-size:11px;color:var(--mut);margin-top:3px;letter-spacing:1px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ── buttons (exact original feel) ── */
.btn{border-radius:4px;font-family:inherit;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase;padding:6px 14px;border:1px solid var(--acc);background:transparent;color:var(--acc)}
.btn:hover{background:rgba(0,229,176,.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-mut{border-color:var(--mut);color:var(--mut)}.btn-mut:hover{background:rgba(90,127,136,.1)}
.btn-pri{font-weight:700}

/* ── panels ── */
.panel{background:var(--panel);border:1px solid var(--bdr);border-radius:6px;padding:18px}
.sec{font-size:11px;letter-spacing:3px;text-transform:uppercase;font-family:monospace;margin-bottom:12px;border-bottom:1px solid var(--bdr);padding-bottom:8px}

/* ── grid layouts ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.g12{display:grid;grid-template-columns:1.2fr 0.8fr;gap:18px}
@media(max-width:960px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}.g12{grid-template-columns:1fr}}
@media(max-width:600px){.g2,.g3,.g4,.g5,.g12{grid-template-columns:1fr}}

/* ── metric card (original Metric component) ── */
.metric{background:var(--surf);border:1px solid var(--bdr);border-radius:4px;padding:10px 14px;min-width:90px}
.m-lbl{font-size:10px;color:var(--mut);letter-spacing:2px;font-family:monospace;margin-bottom:4px;text-transform:uppercase}
.m-val{font-size:20px;font-family:monospace;font-weight:700}
.m-unit{font-size:12px;color:var(--mut);margin-left:4px;font-weight:400}

/* ── CSV hint ── */
.csv-hint{border-radius:4px;padding:8px 14px;font-size:10px;color:var(--mut);display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* ── chart box ── */
.chart-box{position:relative;height:260px;width:100%}

/* ── AI panel (original style) ── */
.ai-out{font-size:12px;line-height:1.8;color:var(--txt);white-space:pre-wrap;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bdr) transparent;padding-bottom:8px}
.ai-idle{height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mut);font-size:12px;text-align:center}
.blink{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block}

/* ── data preview table (original) ── */
.dt-wrap{max-height:180px;overflow-y:auto;scrollbar-width:thin}
.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{text-align:left;padding:4px 10px;border-bottom:1px solid var(--bdr);letter-spacing:2px;font-size:10px}
.dt td{padding:4px 10px;color:var(--txt);border-bottom:1px solid var(--grid)}
.dt tr:nth-child(even) td{background:rgba(255,255,255,.02)}

/* ── layer stratigraphy table (NEW) ── */
.lt{width:100%;border-collapse:collapse;font-size:11px;font-family:monospace}
.lt th{background:var(--surf);padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bdr);white-space:nowrap}
.lt td{padding:7px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
.lt tr:hover td{background:rgba(255,255,255,.015)}

/* ── anomaly badges ── */
.ab{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;font-family:monospace;letter-spacing:1px;text-transform:uppercase;border:1px solid}
.grn{background:rgba(0,200,83,.12);color:#00c853;border-color:rgba(0,200,83,.28)}
.blu{background:rgba(56,189,248,.10);color:#38bdf8;border-color:rgba(56,189,248,.26)}
.amb{background:rgba(245,166,35,.10);color:#f5a623;border-color:rgba(245,166,35,.26)}
.red{background:rgba(255,77,77,.10);color:#ff4d4d;border-color:rgba(255,77,77,.26)}
.pur{background:rgba(192,132,252,.10);color:#c084fc;border-color:rgba(192,132,252,.26)}
.org{background:rgba(251,146,60,.10);color:#fb923c;border-color:rgba(251,146,60,.26)}

/* ── interpretation note box ── */
.ibox{background:rgba(0,229,176,.04);border-left:3px solid var(--acc);border-radius:0 4px 4px 0;padding:12px 14px;font-size:12px;line-height:1.8;color:var(--mut);margin-top:12px}
.ibox h4{font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;font-family:monospace}

/* ── terrain map ── */
#terrain-canvas{width:100%;display:block;border-radius:4px}
.coord-hdr-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 32px;gap:6px;margin-bottom:6px}
.coord-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 32px;gap:6px;margin-bottom:5px;align-items:center}
.coord-row input,.coord-hdr-row div{font-family:monospace;font-size:11px}
.coord-row input{background:var(--surf);border:1px solid var(--bdr);color:var(--txt);border-radius:3px;padding:5px 8px;width:100%}
.coord-row input:focus{outline:none;border-color:var(--acc)}
.chdr{font-size:9px;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
.del-btn{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:3px;width:30px;height:30px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.del-btn:hover{background:rgba(255,77,77,.1)}
.clr-bar{display:flex;height:16px;border-radius:4px;overflow:hidden;margin-bottom:4px}
.clr-lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);font-family:monospace}

/* ── BOREHOLE COLUMN (IX1D-style) ── */
#bh-wrap{display:flex;gap:0;align-items:stretch;width:100%;overflow:hidden}
#bh-svg-col{flex-shrink:0;position:relative}
#bh-svg-col svg{display:block}
#bh-info-panel{flex:1;min-width:0;background:var(--surf);border:1px solid var(--bdr);border-left:none;border-radius:0 6px 6px 0;display:flex;flex-direction:column;justify-content:center;padding:22px 20px;transition:all .25s}
.bh-layer-seg{cursor:pointer;transition:opacity .15s}
.bh-layer-seg:hover rect.seg-fill{filter:brightness(1.25)}
.bh-layer-seg.active rect.seg-fill{filter:brightness(1.4);stroke:var(--acc);stroke-width:2}
.bh-detail-header{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--acc);margin-bottom:14px;font-family:monospace;border-bottom:1px solid var(--bdr);padding-bottom:8px}
.bh-detail-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:8px}
.bh-detail-label{font-size:10px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;font-family:monospace;flex-shrink:0}
.bh-detail-val{font-size:15px;font-weight:700;font-family:monospace;text-align:right}
.bh-idle{color:var(--mut);font-size:11px;text-align:center;letter-spacing:1px;padding:20px 0;line-height:2}
.bh-geo-bar{height:4px;border-radius:2px;margin:12px 0 4px;width:100%}
.bh-rho-bar-wrap{margin-top:14px}
.bh-rho-bar-label{font-size:9px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;font-family:monospace;margin-bottom:4px}
.bh-rho-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--blu),var(--acc),var(--amb),var(--red));position:relative;overflow:visible}
.bh-rho-marker{position:absolute;top:-3px;width:3px;height:14px;background:#fff;border-radius:2px;transform:translateX(-50%);transition:left .3s}
.bh-rho-val{font-size:9px;color:var(--mut);font-family:monospace;margin-top:3px;text-align:right}
.bh-swatch{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.2);flex-shrink:0;display:inline-block;vertical-align:middle;margin-right:6px}
/* ── footer ── */
#footer{border-top:1px solid var(--bdr);background:var(--surf);padding:10px 28px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--mut);letter-spacing:1px;flex-shrink:0;flex-wrap:wrap;gap:6px}

/* ── API key overlay ── */
#key-overlay{position:fixed;inset:0;background:rgba(7,13,15,0.96);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(4px)}
.key-card{background:var(--panel);border:1px solid rgba(0,229,176,0.35);border-radius:10px;padding:36px;max-width:460px;width:calc(100% - 40px)}
.key-card h2{font-size:20px;font-weight:700;color:var(--acc);letter-spacing:3px;margin-bottom:8px}
.key-card p{font-size:12px;color:var(--mut);line-height:1.7;margin-bottom:20px}
.key-input{width:100%;background:var(--surf);border:1px solid var(--bdr);border-radius:4px;padding:11px 14px;color:var(--txt);font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;margin-bottom:12px;letter-spacing:1px}
.key-input:focus{border-color:var(--acc)}
.key-input::placeholder{color:var(--mut)}
.key-note{font-size:10px;color:var(--mut);margin-top:10px;line-height:1.7}
.key-note a{color:var(--blu)}
.api-dot{width:7px;height:7px;border-radius:50%;background:var(--red);transition:background .3s;flex-shrink:0}
.api-dot.ready{background:var(--acc)}
</style>

<div id="hdr">

    <div class="logo-icon">🌍</div>
    <div>
      <div class="logo-name">GEOPHYS<span>AI</span></div>
      <div class="logo-sub">INTELLIGENT GEOPHYSICAL INTERPRETATION SYSTEM</div>
    </div>
  </div>

    <span class="badge" style="color:var(--blu)">10 METHODS</span>
    <span class="badge" style="color:var(--grn)">DYNAMIC DATA</span>
  </div>
</div>

<!-- TABS -->
<div id="tabs"></div>

<!-- BODY -->
<div id="body"></div>

<!-- FOOTER -->
<div id="footer">
  <span>GEOPHYSAI · POWERED BY CLAUDE · APPLIED GEOPHYSICS MODULE</span>
  <span>VES · ERT · IP · SP · EM · GPR · MAGNETIC · GRAVITY · SEIS.REFRACTION · SEIS.REFLECTION · TERRAIN MAP</span>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   CLAUDE ENVIRONMENT — no API key needed, auth handled
═══════════════════════════════════════════════════════════ */
let API_KEY = "claude-env"; // signals we're running inside claude.ai
function saveKey(){}
function showKeyOverlay(){}

/* ═══════════════════════════════════════════════════════════
   PALETTE  (exact original C object)
═══════════════════════════════════════════════════════════ */
const C={bg:"#070d0f",surface:"#0d1a1e",panel:"#111f24",border:"#1a3540",
  accent:"#00e5b0",accentDim:"#007a5e",amber:"#f5a623",red:"#ff4d4d",
  blue:"#38bdf8",text:"#c8e6ea",muted:"#5a7f88",grid:"#0f2830",
  purple:"#c084fc",green:"#00c853",orange:"#fb923c",pink:"#f472b6"};

/* ═══════════════════════════════════════════════════════════
   METHODS  (original 4 + 6 new + terrain tab)
═══════════════════════════════════════════════════════════ */
const METHODS=[
  {id:"ves",    label:"VES",              full:"Vertical Electrical Sounding",      icon:"⚡",color:C.accent},
  {id:"ert",    label:"ERT",              full:"Electrical Resistivity Tomography", icon:"🔌",color:C.blue},
  {id:"ip",     label:"IP",               full:"Induced Polarization",              icon:"⚗️",color:C.amber},
  {id:"sp",     label:"SP",               full:"Self-Potential Survey",             icon:"🔋",color:C.purple},
  {id:"em",     label:"EM",               full:"Electromagnetic Survey (EM34)",     icon:"📡",color:C.orange},
  {id:"gpr",    label:"GPR",              full:"Ground Penetrating Radar",          icon:"📶",color:C.pink},
  {id:"magnetic",label:"Magnetic",        full:"Magnetic Survey",                   icon:"🧲",color:C.amber},
  {id:"gravity", label:"Gravity",         full:"Gravity Survey",                    icon:"⬇️",color:C.purple},
  {id:"sref",   label:"Seis.Refraction",  full:"Seismic Refraction Survey",         icon:"〜",color:C.green},
  {id:"srefl",  label:"Seis.Reflection",  full:"Seismic Reflection Survey",         icon:"≋", color:C.orange},
  {id:"terrain",label:"Terrain Map",      full:"Geophysical Terrain Contour Map",   icon:"🗺️",color:C.blue},
];

/* ═══════════════════════════════════════════════════════════
   SAMPLE DATA  (original 4 + 6 new)
═══════════════════════════════════════════════════════════ */
const SAMPLE={
  ves:[
    {ab2:1,rho_a:120},{ab2:1.5,rho_a:110},{ab2:2,rho_a:95},{ab2:3,rho_a:78},
    {ab2:5,rho_a:55},{ab2:7,rho_a:42},{ab2:10,rho_a:38},{ab2:15,rho_a:30},
    {ab2:20,rho_a:28},{ab2:30,rho_a:24},{ab2:50,rho_a:22},{ab2:70,rho_a:26},
    {ab2:100,rho_a:35},{ab2:150,rho_a:48},{ab2:200,rho_a:62},
  ],
  ert:Array.from({length:40},(_,i)=>({x:(i%8)*5,depth:-Math.floor(i/8)*3,rho:20+Math.sin(i*.7)*15+(i>20?40:0)+Math.random()*10})),
  ip:Array.from({length:12},(_,i)=>({spacing:(i+1)*5,chargeability:5+Math.sin(i*.5)*3+(i>4&&i<9?33:0),resistivity:80-i*3+(i>4&&i<9?-30:0)})),
  sp:Array.from({length:21},(_,i)=>({station:i*10,sp:2-Math.exp(-((i-10)**2)/8)*185})),
  em:Array.from({length:21},(_,i)=>({station:i*10,inphase:8+Math.exp(-((i-10)**2)/6)*610,quadrature:3+Math.exp(-((i-10)**2)/8)*120})),
  gpr:Array.from({length:21},(_,i)=>({distance:i,amplitude:5+Math.exp(-((i-10)**2)/4)*80})),
  magnetic:Array.from({length:50},(_,i)=>({station:i*10,tmf:32000+Math.sin(i*.3)*200+(i>20&&i<35?800:0)+Math.random()*50,rtp:32000+Math.sin(i*.3)*180+(i>22&&i<33?750:0)+Math.random()*30})),
  gravity:Array.from({length:45},(_,i)=>({station:i*20,bouguer:-12+Math.cos(i*.25)*3+(i>18&&i<30?-5:0)+Math.random()*.5,freeair:-8+Math.cos(i*.25)*4+(i>18&&i<30?-4:0)+Math.random()*.5})),
  sref:Array.from({length:20},(_,i)=>({distance:i*5,traveltime:i<8?i*3.1:24+(i-8)*5.6})),
  srefl:Array.from({length:21},(_,i)=>({cmp:i*50,twt:820+Math.sin(i*.3)*15+Math.random()*8})),
};

/* ═══════════════════════════════════════════════════════════
   VES LAYER MODEL  — default sample layers (used only with sample data)
   When real CSV is uploaded, layers are dynamically derived from the data.
   Cumulative depths are computed from thick values.
═══════════════════════════════════════════════════════════ */
const DEFAULT_VES_LAYERS=[
  {n:1,name:"Topsoil / Laterite",       res:85,   thick:3,   dens:1.65,cls:"amb",lbl:"Dry Overburden",      target:""},
  {n:2,name:"Weathered Zone",            res:32,   thick:8,   dens:1.80,cls:"amb",lbl:"Partly Saturated",    target:""},
  {n:3,name:"Clayey Sand (Aquitard)",    res:18,   thick:11,  dens:1.95,cls:"pur",lbl:"Protective Aquitard", target:""},
  {n:4,name:"Fractured Basement",        res:220,  thick:12,  dens:2.10,cls:"grn",lbl:"★ Primary Aquifer",   target:"AQUIFER"},
  {n:5,name:"Fresh Basement Rock",       res:4800, thick:null,dens:2.65,cls:"red",lbl:"Resistive Bedrock",   target:""},
];
const DEFAULT_VES_RMS=3.2;

/* Derive VES layers dynamically from uploaded resistivity sounding data.
   Uses a simple segmentation: groups the rho_a curve into monotone runs
   and assigns geological labels by resistivity magnitude.               */
function deriveVESLayers(data){
  if(!data||data.length<2) return {layers:DEFAULT_VES_LAYERS,rms:DEFAULT_VES_RMS};
  const sorted=[...data].sort((a,b)=>a.ab2-b.ab2);
  /* estimate layer count from inflection points in rho_a (simplified) */
  const rhoVals=sorted.map(r=>r.rho_a).filter(v=>!isNaN(v));
  if(rhoVals.length<2) return {layers:DEFAULT_VES_LAYERS,rms:DEFAULT_VES_RMS};

  /* find direction changes to detect layer boundaries */
  const boundaries=[];
  for(let i=1;i<rhoVals.length-1;i++){
    const d1=rhoVals[i]-rhoVals[i-1];
    const d2=rhoVals[i+1]-rhoVals[i];
    if(d1*d2<0) boundaries.push(i); /* sign change = inflection */
  }

  /* build layer segments between boundaries */
  const segments=[];
  const bp=[0,...boundaries,rhoVals.length-1];
  for(let s=0;s<bp.length-1;s++){
    const segRho=rhoVals.slice(bp[s],bp[s+1]+1);
    const meanRho=segRho.reduce((a,b)=>a+b,0)/segRho.length;
    const ab2Start=sorted[bp[s]].ab2;
    const ab2End=sorted[bp[s+1]].ab2;
    /* crude depth estimate: depth ≈ AB/2 × 0.4 for Schlumberger */
    const depthEst=Math.round(ab2Start*0.4);
    const thickEst=s<bp.length-2?Math.round((ab2End-ab2Start)*0.4):null;
    segments.push({meanRho,depthEst,thickEst,ab2Start,ab2End});
  }

  /* assign geology by resistivity */
  function geoLabel(rho){
    if(rho<8)  return {name:"Saline/Clay Zone",    dens:1.90,cls:"red",lbl:"Saline / Clay",        target:""};
    if(rho<25) return {name:"Conductive Clay",      dens:1.85,cls:"pur",lbl:"Clayey Overburden",    target:""};
    if(rho<60) return {name:"Weathered Zone",        dens:1.80,cls:"amb",lbl:"Partly Saturated",     target:""};
    if(rho<150)return {name:"Fractured/Sat. Zone",  dens:2.05,cls:"grn",lbl:"Possible Aquifer",     target:"AQUIFER"};
    if(rho<500)return {name:"Fractured Basement",   dens:2.10,cls:"grn",lbl:"★ Primary Aquifer",    target:"AQUIFER"};
    if(rho<2000)return{name:"Weathered Basement",   dens:2.40,cls:"blu",lbl:"Resistive Basement",   target:""};
    return              {name:"Fresh Basement Rock", dens:2.65,cls:"red",lbl:"Resistive Bedrock",    target:""};
  }

  /* cap at 6 layers for readability */
  const useSegs=segments.slice(0,6);
  const layers=useSegs.map((seg,i)=>{
    const geo=geoLabel(seg.meanRho);
    return {
      n:i+1,
      name:geo.name,
      res:Math.round(seg.meanRho),
      thick:seg.thickEst,
      dens:geo.dens,
      cls:geo.cls,
      lbl:geo.lbl,
      target:geo.target,
    };
  });

  /* simple RMS estimate: compare smoothed curve to raw */
  const smoothed=sorted.map((_,i)=>{
    const w=rhoVals.slice(Math.max(0,i-1),i+2);
    return w.reduce((a,b)=>a+b,0)/w.length;
  });
  const rmsCalc=Math.sqrt(sorted.reduce((acc,r,i)=>{
    const diff=(r.rho_a-smoothed[i])/(r.rho_a||1);
    return acc+diff*diff;
  },0)/sorted.length)*100;
  const rms=Math.min(15,Math.max(0.5,+rmsCalc.toFixed(1)));

  return {layers,rms};
}

   STATS  (mirrors original computeStats)
═══════════════════════════════════════════════════════════ */
function computeStats(id){
  const d=S.data[id]; if(!d||!d.length) return null;
  const key={ves:"rho_a",ert:"rho",ip:"chargeability",sp:"sp",em:"inphase",
             gpr:"amplitude",magnetic:"tmf",gravity:"bouguer",sref:"traveltime",srefl:"twt"}[id];
  if(!key) return null;
  const vals=d.map(r=>r[key]).filter(v=>!isNaN(v));
  const mn=Math.min(...vals),mx=Math.max(...vals);
  return{min:mn.toFixed(2),max:mx.toFixed(2),spread:(mx-mn).toFixed(2),points:d.length};
}

1. DATA QUALITY ASSESSMENT
1a. Outliers/anomalous readings: [list flagged AB/2 values, their ρₐ, and probable cause — 2 sentences max]
1b. RMS misfit: [value]% — verdict: [GOOD / FAIR / POOR]
1c. Data coverage: n=[count] points, AB/2 range [min]–[max] m, effective depth of investigation ~[value] m
1d. Quality rating: [GOOD / MODERATE / POOR] — [one-sentence justification]

2. GEOPHYSICAL INTERPRETATION
2a. Curve type: [EXACT label from GROUND_TRUTH] — [one-line definition of that curve type]
2b. Anomaly character: [describe descending limb, trough, ascending limb and geological meaning — 2 sentences max]
2c. Geological setting: [inferred terrain type — one sentence]

3. SUBSURFACE MODEL
[Output ALL layers one per line in exact format — copy from GROUND_TRUTH]
[Then output S calculation block exactly as in GROUND_TRUTH]
[Then output T calculation block exactly as in GROUND_TRUTH]

4. TARGET ASSESSMENT
4a. Target type: [from GROUND_TRUTH]
4b. Depth to top: [from GROUND_TRUTH] m bgl
4c. Depth to base: [from GROUND_TRUTH] m bgl
4d. Thickness: [from GROUND_TRUTH] m
4e. Resistivity: [from GROUND_TRUTH] Ω·m
4f. Confidence level: [EXACT rating from GROUND_TRUTH] — [one-sentence justification]

5. DRILLING RECOMMENDATIONS
5a. Recommended total depth (TD): [from GROUND_TRUTH] m
5b. Casing depth: [from GROUND_TRUTH] m
5c. Screen interval: [from GROUND_TRUTH] m
5d. Expected yield: [EXACT word from GROUND_TRUTH]
5e. Water quality prediction: [EXACT word from GROUND_TRUTH] — [one-sentence justification based on aquifer resistivity]
5f. Follow-up surveys recommended: [comma-separated list from GROUND_TRUTH]`,
        messages:[{role:"user",content:prompt}],
      }),
    });
  }catch(fetchErr){
    throw new Error("Network error — cannot reach Anthropic API. ("+fetchErr.message+")");
  }

  /* ── check HTTP status ── */
  if(!res.ok){
    let errMsg=`HTTP ${res.status}`;
    try{const j=await res.json();errMsg=j.error?.message||errMsg;}catch{}
    if(res.status===401) errMsg="Invalid API key — please click 🔑 API Key and re-enter your key.";
    if(res.status===429) errMsg="Rate limit / quota exceeded — check your Anthropic billing at console.anthropic.com.";
    throw new Error(errMsg);
  }

  /* ── stream response ── */
  const reader=res.body.getReader(),dec=new TextDecoder();
  let full="";
  while(true){
    const{done,value}=await reader.read();if(done)break;
    for(const line of dec.decode(value).split("\n").filter(l=>l.startsWith("data:"))){
      try{
        const j=JSON.parse(line.slice(5));
        if(j.type==="content_block_delta"&&j.delta?.text){full+=j.delta.text;onChunk(full);}
      }catch{}
    }
  }
  return full;
}


/* ═══════════════════════════════════════════════════════════
   DATA FINGERPRINT  — deterministic hash of input dataset
   Same data always produces the same hex string.
   Shown alongside every AI report for reproducibility auditing.
═══════════════════════════════════════════════════════════ */
async function dataHash(id){
  const d=S.data[id];
  const str=JSON.stringify(d);
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).slice(0,6).map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
}

/* ═══════════════════════════════════════════════════════════
   BUILD PROMPT  (locked schema + data fingerprint)
═══════════════════════════════════════════════════════════ */
function buildPrompt(id){
  const d=S.data[id],s=computeStats(id);
  const names={ves:"Vertical Electrical Sounding (Schlumberger array)",ert:"Electrical Resistivity Tomography (dipole-dipole)",
    ip:"Induced Polarization Survey",sp:"Self-Potential Survey",em:"Electromagnetic Survey (EM34)",
    gpr:"Ground Penetrating Radar (250 MHz)",magnetic:"Ground Magnetic Survey (TMF + RTP)",
    gravity:"Ground Gravity Survey (Bouguer + Free-Air)",sref:"Seismic Refraction Survey",srefl:"Seismic Reflection Survey"};
  /* ── Build dynamic VES GROUND_TRUTH from actual loaded data ── */
  function buildVesGT(data, layers, rms){
    const sorted=[...data].sort((a,b)=>a.ab2-b.ab2);
    const rhoArr=sorted.map(r=>r.rho_a).filter(v=>!isNaN(v));
    const n=sorted.length;
    const ab2Min=sorted[0]?.ab2||0, ab2Max=sorted[n-1]?.ab2||0;
    const depthInv=Math.round(ab2Max*0.4);

    /* outlier detection: flag points >2 std dev from local mean */
    let outlierLines="";
    const mean=rhoArr.reduce((a,b)=>a+b,0)/rhoArr.length;
    const std=Math.sqrt(rhoArr.reduce((acc,v)=>acc+(v-mean)**2,0)/rhoArr.length);
    sorted.forEach(r=>{
      if(Math.abs(r.rho_a-mean)>2.5*std){
        outlierLines+=`\n• AB/2=${r.ab2}m → rho=${r.rho_a.toFixed(2)} Ohm.m: statistical outlier (>2.5σ from mean ${mean.toFixed(0)} Ω·m); field verification recommended.`;
      }
    });
    if(!outlierLines) outlierLines="\n• No statistically significant outliers detected at 2.5σ threshold.";

    /* curve type */
    const first=rhoArr[0],mid=rhoArr[Math.floor(rhoArr.length/2)],last=rhoArr[rhoArr.length-1];
    let curveType="KHA compound";
    if(first<mid&&mid>last) curveType="K-type — resistive middle layer between two conductive layers";
    else if(first>mid&&mid<last) curveType="H-type — conductive middle layer between two resistive layers";
    else if(first<mid&&mid<last) curveType="A-type — uniformly ascending (increasing resistivity with depth)";
    else if(first>mid&&mid>last) curveType="Q-type — uniformly descending (decreasing resistivity with depth)";
    else curveType="KHA compound — resistive surface (K), conductive weathered zone (H), ascending basement (A); classic crystalline basement tropical profile";

    /* quality */
    const qualWord=rms<5?"GOOD":rms<10?"MODERATE":"POOR";
    const coverWord=n>=15?"GOOD":n>=8?"MODERATE":"LIMITED";

    /* layer lines */
    let cum=0;
    const layerLines=layers.map(l=>{
      const top=cum, base=l.thick?cum+l.thick:null;
      if(l.thick) cum+=l.thick;
      const desc=l.res<25?"Conductive clay or saturated zone":
        l.res<80?"Weathered zone with partial saturation":
        l.res<300?"Possible aquifer or fractured zone":
        l.res<2000?"Resistive basement or hard rock":
        "Competent crystalline basement";
      return `L${l.n} | ${l.name} | Depth: ${top}-${base!==null?base:"inf"} m | rho: ${l.res} Ohm.m | h: ${l.thick||"inf"} m | density: ${l.dens} g/cm3 | ${desc}`;
    }).join("\n");

    /* Dar Zarrouk S — overburden layers */
    const overb=layers.filter(l=>!l.target&&l.thick);
    let Swork=overb.map(l=>`(${l.thick}/${l.res})`).join(" + ");
    const Sval=overb.reduce((acc,l)=>acc+(l.thick/l.res),0);
    const Scat=Sval<0.1?"WEAK":Sval<1.0?"MODERATE":"STRONG";
    const Sline=`S = ${Swork} = ${Sval.toFixed(4)}\nS = ${Sval.toFixed(3)} Siemens — Protective capacity: ${Scat}`;

    /* Dar Zarrouk T — aquifer layer */
    const aqL=layers.find(l=>l.target==="AQUIFER");
    const Tline=aqL?`T = h${aqL.n} x rho${aqL.n} = ${aqL.thick} x ${aqL.res}\nT = ${aqL.thick*aqL.res} Ohm.m2`:"T = N/A (no aquifer layer detected)";

    /* target */
    const aqTop=aqL?(()=>{let c=0;for(const l of layers){if(l===aqL)return c;if(l.thick)c+=l.thick;}return 0;})():null;
    const aqBase=aqTop!==null&&aqL?.thick?aqTop+aqL.thick:null;
    const td=aqBase?Math.round(aqBase+9):Math.round(depthInv+10);
    const waterQ=aqL&&aqL.res>=80?"FRESH — aquifer resistivity well above brackish threshold; consistent with low TDS":"SUSPECT — low resistivity may indicate salinity or clay contamination; chemical analysis required";
    const yield_=aqL&&aqL.thick>=10?"MODERATE":"LOW";

    return `
GROUND_TRUTH (derived dynamically from uploaded dataset — do NOT replace with prior hardcoded values):
DATA SOURCE: ${S.uploadName.ves||"Loaded dataset"} — ${n} measurements, AB/2 ${ab2Min}–${ab2Max} m

FLAGGED OUTLIERS:${outlierLines}

RMS MISFIT: ${rms}% — ${qualWord}
DATA COVERAGE: n=${n} points; AB/2 range ${ab2Min}-${ab2Max} m; effective depth of investigation ~${depthInv} m
QUALITY RATING: ${coverWord} — ${rms<5?"Low RMS misfit and adequate data spread":"RMS misfit and/or data coverage suggests interpret results with caution"}

CURVE TYPE: ${curveType}

LAYER LINES (output exactly as shown, one per line):
${layerLines}

DAR ZARROUK S (copy working exactly):
${Sline}

DAR ZARROUK T (copy working exactly):
${Tline}

TARGET TYPE: ${aqL?"Fractured/saturated aquifer zone":"No clear aquifer target detected"}
DEPTH TO TOP: ${aqTop!==null?aqTop+"":"N/A"} m bgl
DEPTH TO BASE: ${aqBase!==null?aqBase+"":"N/A"} m bgl
THICKNESS: ${aqL?.thick||"N/A"} m
AQUIFER RESISTIVITY: ${aqL?.res||"N/A"} Ohm.m
CONFIDENCE: ${Sval>0.5&&aqL?"MODERATE":"LOW"} — model derived from ${n} data points with RMS ${rms}%; ${n<10?"limited electrode spread reduces depth resolution":"adequate spread for target depth"}

TD: ${td} m
CASING DEPTH: ${aqTop!==null?aqTop:"N/A"} m
SCREEN INTERVAL: ${aqTop!==null&&aqBase!==null?`${aqTop}-${aqBase}`:"N/A"} m
EXPECTED YIELD: ${yield_}
WATER QUALITY: ${waterQ}
FOLLOW-UP: 2D ERT profiling, seismic refraction, VLF-EM survey, borehole geophysical logging, pumping test`;
  }

  const isUploaded=!!(S.uploadName[id]);
  const vesGT=id==="ves"
    ? buildVesGT(S.data.ves||[], S.vesLayers, S.vesRms)
    : "";

  const extras={
    ves:vesGT,
    ip:"\nNote: chargeability >20 ms is diagnostic of sulphide mineralisation.",
    sp:"\nNote: Negative SP anomaly -> oxidising sulphide body (Sato-Mooney electrochemical model).",
  };
  return `Method: ${names[id]||id.toUpperCase()}
Data statistics: min=${s.min}, max=${s.max}, range=${s.spread}, n=${s.points} points
Full dataset: ${JSON.stringify(d)}${extras[id]||""}

INSTRUCTION: Follow the mandatory output schema exactly. Copy all GROUND_TRUTH values verbatim. Every section and sub-item is required. Do not omit, reorder, or add any field.`;
}

/* ═══════════════════════════════════════════════════════════
   FILE UPLOAD  (mirrors original handleFile)
═══════════════════════════════════════════════════════════ */
function handleFile(e,id){
  const file=e.target.files[0];if(!file) return;
  S.uploadName[id]=file.name;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const lines=ev.target.result.split("\n").filter(l=>l.trim());
      const rawHeaders=lines[0].split(",").map(h=>h.trim().toLowerCase());

      /* ── expected column names per method ── */
      const expectedKeys={
        ves:["ab2","rho_a"], ert:["x","depth","rho"],
        ip:["spacing","chargeability","resistivity"], sp:["station","sp"],
        em:["station","inphase","quadrature"], gpr:["distance","amplitude"],
        magnetic:["station","tmf","rtp"], gravity:["station","bouguer","freeair"],
        sref:["distance","traveltime"], srefl:["cmp","twt"],
      };
      const wantedKeys=expectedKeys[id]||[];

      /* check if headers match the expected schema */
      const headersMatch=wantedKeys.length>0&&wantedKeys.every(k=>rawHeaders.includes(k));

      if(headersMatch){
        /* ── named-column parse (original v3 behaviour) ── */
        const rows=lines.slice(1).map(l=>{
          const vals=l.split(",");const obj={};
          rawHeaders.forEach((h,i)=>{const n=parseFloat(vals[i]);obj[h]=isNaN(n)?vals[i]?.trim()||"":n;});
          return obj;
        }).filter(r=>Object.values(r).some(v=>typeof v==="number"&&!isNaN(v)));
        if(rows.length===0){S.error[id]="CSV parsed but no numeric rows found.";render();return;}
        S.data[id]=rows;S.aiText[id]="";
        /* re-derive VES layer model from real uploaded data */
        if(id==="ves"){const d=deriveVESLayers(rows);S.vesLayers=d.layers;S.vesRms=d.rms;}
        render();
      }else{
        /* ── two-column fallback (v2 behaviour): col0=x, col1=y ── */
        const fallbackKey=wantedKeys;
        const k0=wantedKeys[0]||rawHeaders[0]||"x";
        const k1=wantedKeys[1]||rawHeaders[1]||"y";
        const rows=[];
        /* try to detect if row 0 is a header by checking if first cell is non-numeric */
        const startRow=isNaN(parseFloat(lines[0].split(",")[0]))?1:0;
        for(let i=startRow;i<lines.length;i++){
          const parts=lines[i].split(",");
          const a=parseFloat(parts[0]),b=parseFloat(parts[1]);
          if(!isNaN(a)&&!isNaN(b)){const obj={};obj[k0]=a;obj[k1]=b;rows.push(obj);}
        }
        if(rows.length===0){S.error[id]=`Could not parse CSV. Use headers: ${wantedKeys.join(", ")} — or two plain numeric columns.`;render();return;}
        S.data[id]=rows;S.aiText[id]="";
        /* re-derive VES layer model from real uploaded data (fallback path) */
        if(id==="ves"){const d=deriveVESLayers(rows);S.vesLayers=d.layers;S.vesRms=d.rms;}
        S.error[id]=``;/* clear any previous error */
        render();
        /* friendly notice */
        const panel=document.getElementById("ai-panel");
        if(panel) panel.innerHTML=`<div style="color:var(--amb);font-size:11px;line-height:1.7">
          ✅ <strong>${rows.length} rows</strong> loaded (two-column fallback — columns mapped as <code>${k0}</code> / <code>${k1}</code>).<br>
          For best results use headers: <code>${(expectedKeys[id]||[]).join(", ")}</code><br>
          Click <strong>Run AI Analysis</strong> to interpret.
        </div>`;
      }
    }catch(err){S.error[id]="Failed to parse CSV: "+err.message;render();}
  };
  reader.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════
   FORMAT AI TEXT  — converts schema headings to styled HTML
═══════════════════════════════════════════════════════════ */
function formatAIText(raw,col,streaming=false){
  const lines=raw.split("\n");
  let html="";
  for(const line of lines){
    /* strip markdown bold/italic and ## headings the AI sometimes emits */
    let l=line.trimEnd()
      .replace(/\*\*([^*]+)\*\*/g,"$1")
      .replace(/\*([^*]+)\*/g,"$1")
      .replace(/^#{1,3}\s+/,"")
      .replace(/^---+$/,"");

    /* section divider ━━━ */
    if(/^━+$/.test(l)||l.trim()==="---"||l.trim()===""){
      html+=l.trim()===""?`<div style="height:4px"></div>`:`<div style="border-top:1px solid ${col}30;margin:10px 0 4px"></div>`;
    /* numbered heading  1. / 2. / 3. etc */
    }else if(/^\d+\.\s+[A-Z]/.test(l)){
      html+=`<div style="color:${col};font-weight:700;font-size:11px;letter-spacing:2px;margin:12px 0 5px;text-transform:uppercase;border-bottom:1px solid ${col}20;padding-bottom:4px">${esc(l)}</div>`;
    /* sub-item  1a. / 2b. / 5f. etc — with or without leading spaces */
    }else if(/^\s*\d+[a-f]\.\s/.test(l)){
      const parts=l.trim().match(/^(\d+[a-f]\.\s[^:]+:\s*)(.*)$/);
      if(parts){
        html+=`<div style="display:flex;gap:8px;margin:4px 0 4px 8px;align-items:baseline">
          <span style="color:var(--mut);min-width:195px;font-size:11px;flex-shrink:0">${esc(parts[1])}</span>
          <span style="color:var(--txt);font-size:11px">${esc(parts[2])}</span>
        </div>`;
      }else{
        html+=`<div style="margin:4px 0 4px 8px;font-size:11px;color:var(--txt)">${esc(l.trim())}</div>`;
      }
    /* bullet  • or - */
    }else if(/^\s*[•·\-]\s/.test(l)){
      html+=`<div style="margin:3px 0 3px 16px;font-size:11px;color:var(--txt)">${esc(l.trim().replace(/^[-•·]\s/,"• "))}</div>`;
    /* layer line  L1 | name | ... */
    }else if(/^\s*L\d+\s*\|/.test(l)){
      const cols=l.split("|").map(c=>c.trim());
      html+=`<div style="display:grid;grid-template-columns:28px 1fr 1fr 1fr 1fr 2fr;gap:4px;margin:3px 0;padding:5px 8px;background:${col}08;border-left:3px solid ${col}50;border-radius:0 3px 3px 0;font-size:10px;font-family:monospace">
        ${cols.map((c,i)=>`<span style="color:${i===0?col:i===5?"var(--mut)":"var(--txt)"}">${esc(c)}</span>`).join("")}
      </div>`;
    /* Dar Zarrouk computed values (lines starting with S = or T = ) */
    }else if(/^[ST]\s*=/.test(l.trim())){
      html+=`<div style="margin:3px 0 3px 16px;font-size:11px;color:${col};font-family:monospace;font-weight:700">${esc(l.trim())}</div>`;
    /* plain text / continuation */
    }else{
      html+=`<div style="font-size:11px;color:var(--txt);margin:2px 0;line-height:1.7">${esc(l)}</div>`;
    }
  }
  if(streaming) html+=`<span class="blink" style="color:${col}">▋</span>`;
  return html;
}

/* ═══════════════════════════════════════════════════════════
   RUN AI ANALYSIS
═══════════════════════════════════════════════════════════ */
async function runAnalysis(id){
  if(!computeStats(id)) return;
  S.loading[id]=true;S.aiText[id]="";S.error[id]="";render();

  /* compute data fingerprint before analysis */
  const hash=await dataHash(id);
  const ts=new Date().toISOString().replace("T"," ").slice(0,19)+" UTC";
  const col=METHODS.find(m=>m.id===id).color;

  /* stamp panel with hash header immediately */
  const stampHtml=()=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:${col}08;border:1px solid ${col}25;border-radius:4px;margin-bottom:10px;font-size:10px;font-family:monospace">
    <span style="color:${col}">DATA FINGERPRINT</span>
    <span style="color:var(--txt);letter-spacing:2px">SHA-256[6] = <strong style="color:${col}">${hash}</strong></span>
    <span style="color:var(--mut)">${ts}</span>
  </div>`;

  try{
    await callAI(buildPrompt(id),text=>{
      S.aiText[id]=text;
      const el=document.getElementById("ai-panel");
      if(el) el.innerHTML=stampHtml()+`<div class="ai-out">${formatAIText(text,col,true)}</div>`;
    });
  }catch(err){S.error[id]="AI analysis failed: "+err.message;}
  finally{
    S.loading[id]=false;
    /* final render with hash still visible */
    const el=document.getElementById("ai-panel");
    if(el&&S.aiText[id]) el.innerHTML=stampHtml()+`<div class="ai-out">${formatAIText(S.aiText[id],col,false)}</div>`;
    else render();
  }
}

  const units=[...document.querySelectorAll(".lu")].map(e=>e.value);
  const n=Math.min(lons.length,lats.length,vals.length);
  if(n<3){alert("Please enter at least 3 complete station rows (lon + lat + value).");return;}

  const pts=Array.from({length:n},(_,i)=>({lon:lons[i],lat:lats[i],val:vals[i],lbl:lbls[i]||"S"+(i+1),unit:units[i]||""}));
  const minLon=Math.min(...pts.map(p=>p.lon)),maxLon=Math.max(...pts.map(p=>p.lon));
  const minLat=Math.min(...pts.map(p=>p.lat)),maxLat=Math.max(...pts.map(p=>p.lat));
  const minV=Math.min(...pts.map(p=>p.val)),maxV=Math.max(...pts.map(p=>p.val));
  const fUnit=pts[0]?.unit||"";

  const cvs=document.getElementById("terrain-canvas");if(!cvs) return;
  const ctx=cvs.getContext("2d");
  const W=cvs.width,H=cvs.height,PAD=66;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);

  /* coordinate → pixel */
  const toX=lon=>PAD+(lon-minLon)/(maxLon-minLon||1e-6)*(W-2*PAD);
  const toY=lat=>H-PAD-(lat-minLat)/(maxLat-minLat||1e-6)*(H-2*PAD);

  /* Surfer-style rainbow colour ramp */
  function valColor(v,a=1){
    const t=Math.max(0,Math.min(1,(v-minV)/(maxV-minV||1)));
    const stops=[[0,40,180],[0,100,255],[0,210,210],[0,200,80],[255,220,0],[255,80,0],[200,0,0]];
    const si=t*(stops.length-1);
    const lo=stops[Math.floor(si)],hi=stops[Math.min(Math.ceil(si),stops.length-1)],f=si%1;
    return `rgba(${(lo[0]+(hi[0]-lo[0])*f)|0},${(lo[1]+(hi[1]-lo[1])*f)|0},${(lo[2]+(hi[2]-lo[2])*f)|0},${a})`;
  }

  /* IDW grid (power = 2, geographically correct distances) */
  const CELL=10;
  const gW=Math.ceil((W-2*PAD)/CELL)+1,gH=Math.ceil((H-2*PAD)/CELL)+1;
  const grid=[];
  for(let gy=0;gy<gH;gy++){
    grid[gy]=[];
    for(let gx=0;gx<gW;gx++){
      const lon=minLon+gx/(gW-1||1)*(maxLon-minLon);
      const lat=minLat+(gH-1-gy)/(gH-1||1)*(maxLat-minLat);
      let wS=0,vS=0;
      pts.forEach(p=>{
        const dx=(p.lon-lon)*Math.cos(lat*Math.PI/180)*111320;
        const dy=(p.lat-lat)*111320;
        const d2=dx*dx+dy*dy+1e-9;
        const w=1/d2;wS+=w;vS+=w*p.val;
      });
      grid[gy][gx]=vS/wS;
    }
  }

  /* draw filled colour cells */
  for(let gy=0;gy<gH-1;gy++){
    for(let gx=0;gx<gW-1;gx++){
      const v=(grid[gy][gx]+grid[gy+1][gx]+grid[gy][gx+1]+grid[gy+1][gx+1])/4;
      ctx.fillStyle=valColor(v,0.90);
      ctx.fillRect(PAD+gx*CELL,PAD+gy*CELL,CELL+1,CELL+1);
    }
  }

  /* contour iso-lines (7 levels) */
  const nL=7;
  for(let ci=1;ci<nL;ci++){
    const cv=minV+ci/nL*(maxV-minV);
    ctx.strokeStyle="rgba(255,255,255,0.30)";ctx.lineWidth=1;ctx.setLineDash([3,3]);
    for(let gy=0;gy<gH-1;gy++){
      for(let gx=0;gx<gW-1;gx++){
        const px=PAD+gx*CELL,py=PAD+gy*CELL;
        const v00=grid[gy][gx],v10=grid[gy][gx+1],v01=grid[gy+1][gx];
        if((v00>=cv)!==(v10>=cv)){const t=(cv-v00)/(v10-v00||1e-9);ctx.beginPath();ctx.moveTo(px+t*CELL,py);ctx.lineTo(px+t*CELL,py+CELL);ctx.stroke();}
        if((v00>=cv)!==(v01>=cv)){const t=(cv-v00)/(v01-v00||1e-9);ctx.beginPath();ctx.moveTo(px,py+t*CELL);ctx.lineTo(px+CELL,py+t*CELL);ctx.stroke();}
      }
    }
    /* contour value label */
    ctx.setLineDash([]);ctx.fillStyle="rgba(255,255,255,0.50)";ctx.font="8px 'IBM Plex Mono',monospace";
    const ly=PAD+((ci/nL)*(H-2*PAD));
    ctx.fillText(cv.toFixed(1),PAD+3,ly-2);
  }
  ctx.setLineDash([]);

  /* border */
  ctx.strokeStyle="rgba(0,229,176,0.45)";ctx.lineWidth=1.5;
  ctx.strokeRect(PAD,PAD,W-2*PAD,H-2*PAD);

  /* grid lines + axis tick labels */
  ctx.font="9px 'IBM Plex Mono',monospace";
  for(let i=0;i<=5;i++){
    const lon=minLon+i/5*(maxLon-minLon);
    const x=PAD+i/5*(W-2*PAD);
    ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,PAD);ctx.lineTo(x,H-PAD);ctx.stroke();
    ctx.fillStyle=C.muted;ctx.fillText(lon.toFixed(4)+"°",x-20,H-PAD+14);
  }
  for(let i=0;i<=5;i++){
    const lat=minLat+i/5*(maxLat-minLat);
    const y=H-PAD-i/5*(H-2*PAD);
    ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();
    ctx.fillStyle=C.muted;ctx.fillText(lat.toFixed(4)+"°",2,y+4);
  }

  /* axis titles */
  ctx.fillStyle=C.muted;ctx.font="10px 'IBM Plex Mono',monospace";
  ctx.fillText("Longitude →",W/2-38,H-3);
  ctx.save();ctx.translate(12,H/2+28);ctx.rotate(-Math.PI/2);ctx.fillText("← Latitude",0,0);ctx.restore();

  /* map title */
  ctx.fillStyle="rgba(0,229,176,0.65)";ctx.font="bold 11px 'IBM Plex Mono',monospace";
  ctx.fillText("GEOPHYSICAL CONTOUR MAP  —  IDW INTERPOLATION",PAD+4,PAD-10);

  /* station dots + labels */
  pts.forEach(p=>{
    const px=toX(p.lon),py=toY(p.lat);
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px,py,5.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=C.bg;ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.font="bold 9px 'IBM Plex Mono',monospace";ctx.fillText(p.lbl,px+8,py+4);
    ctx.fillStyle=C.accent;ctx.font="8px 'IBM Plex Mono',monospace";
    ctx.fillText(p.val.toFixed(0)+(p.unit?" "+p.unit:""),px+8,py+14);
  });

  /* ── stats ── */
  const mean=pts.reduce((a,b)=>a+b.val,0)/pts.length;
  const std=Math.sqrt(pts.reduce((a,b)=>a+(b.val-mean)**2,0)/pts.length);
  const med=[...pts.map(p=>p.val)].sort((a,b)=>a-b)[Math.floor(pts.length/2)];
  document.getElementById("t-stats").innerHTML=`
    <div class="g4" style="gap:8px;margin-bottom:8px">
      <div class="metric"><div class="m-lbl">Stations</div><div class="m-val" style="color:var(--blu);font-size:18px">${pts.length}</div></div>
      <div class="metric"><div class="m-lbl">Min Value</div><div class="m-val" style="color:var(--grn);font-size:18px">${minV.toFixed(1)}<span class="m-unit">${fUnit}</span></div></div>
      <div class="metric"><div class="m-lbl">Max Value</div><div class="m-val" style="color:var(--red);font-size:18px">${maxV.toFixed(1)}<span class="m-unit">${fUnit}</span></div></div>
      <div class="metric"><div class="m-lbl">Mean</div><div class="m-val" style="color:var(--amb);font-size:18px">${mean.toFixed(1)}</div></div>
    </div>
    <div class="g4" style="gap:8px">
      <div class="metric"><div class="m-lbl">Median</div><div class="m-val" style="color:var(--acc);font-size:16px">${med.toFixed(1)}</div></div>
      <div class="metric"><div class="m-lbl">Std Dev</div><div class="m-val" style="color:var(--pur);font-size:16px">${std.toFixed(1)}</div></div>
      <div class="metric"><div class="m-lbl">Range</div><div class="m-val" style="color:var(--amb);font-size:16px">${(maxV-minV).toFixed(1)}</div></div>
      <div class="metric"><div class="m-lbl">Contour Int.</div><div class="m-val" style="color:var(--blu);font-size:16px">${((maxV-minV)/nL).toFixed(1)}</div></div>
    </div>
    <div class="metric" style="margin-top:8px"><div class="m-lbl">Longitude Range</div><div style="font-size:11px;color:var(--txt);font-family:monospace;margin-top:4px">${minLon.toFixed(5)}° — ${maxLon.toFixed(5)}°</div></div>
    <div class="metric" style="margin-top:8px"><div class="m-lbl">Latitude Range</div><div style="font-size:11px;color:var(--txt);font-family:monospace;margin-top:4px">${minLat.toFixed(5)}° — ${maxLat.toFixed(5)}°</div></div>`;

  /* colour scale legend */
  const stops=["rgba(0,40,180,1)","rgba(0,100,255,1)","rgba(0,210,210,1)","rgba(0,200,80,1)","rgba(255,220,0,1)","rgba(255,80,0,1)","rgba(200,0,0,1)"];
  const nL2=nL;
  document.getElementById("t-legend").innerHTML=`
    <div class="clr-bar">${stops.map(s=>`<div style="flex:1;background:${s}"></div>`).join("")}</div>
    <div class="clr-lbls">
      ${Array.from({length:6},(_,i)=>`<span>${(minV+(i/5)*(maxV-minV)).toFixed(0)}</span>`).join("")}
      <span>${fUnit}</span>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════
   IX1D BOREHOLE COLUMN
   Renders a vertical stratigraphic column with:
   - Depth axis (left)
   - Colour-coded layer segments (scaled to thickness)
   - Apparent resistivity log track (right of column)
   - Horizontal resistivity tick lines (log scale)
   - Casing & screen symbols
   - Click interaction → detail panel
═══════════════════════════════════════════════════════════ */
function drawBoreholeColumn(){
  const wrap=document.getElementById("bh-svg-col");
  if(!wrap) return;

  /* ── colour per layer class ── */
  const clrMap={
    amb:"#f5a623", pur:"#c084fc", grn:"#00c853", red:"#ff4d4d",
    blu:"#38bdf8", org:"#fb923c", pnk:"#f472b6"
  };
  const patMap={ // hatch fill ids per layer
    amb:"hatch-amb", pur:"hatch-pur", grn:"hatch-grn",
    red:"hatch-red", blu:"hatch-blu"
  };

  /* ── dimensions ── */
  const PAD_TOP=40, PAD_BOT=30, PAD_LEFT=58, COL_W=60, RHO_TRACK=100;
  const SVG_W = PAD_LEFT + COL_W + RHO_TRACK + 20;

  /* compute cumulative depths — use S.vesLayers (dynamic from uploaded data) */
  let cum=0;
  const layers=S.vesLayers.map(l=>{
    const top=cum; const base=l.thick?cum+l.thick:null;
    if(l.thick) cum+=l.thick;
    return {...l,top,base};
  });
  const lastFinite=layers.filter(l=>l.base!==null);
  const finalDepth=lastFinite.length?lastFinite[lastFinite.length-1].base:cum;
  /* last layer (half-space) gets a visual thickness equal to sum/4 or 15m min */
  const halfSpaceVis=Math.max(15, finalDepth*0.3);
  const totalVis=finalDepth+halfSpaceVis;

  const SVG_H=PAD_TOP+PAD_BOT+380; // fixed pixel height
  const depthScale= (d)=> PAD_TOP + (d/totalVis)*(SVG_H-PAD_TOP-PAD_BOT);

  /* ── rho log scale ── */
  /* FIX: enforce minimum 3-decade span so clustered high/low resistivity
     values don't collapse the step-log track into a spike or thin line.
     Also floor rhoMin at 1 Ω·m and ceil rhoMax at 100,000 Ω·m.          */
  const allRho=layers.map(l=>l.res);
  const rawMin=Math.min(...allRho)*0.5;
  const rawMax=Math.max(...allRho)*1.5;
  const rhoMin=Math.max(1, rawMin);
  const minDecadeSpan=3; // at least 3 log-decades (e.g. 1 → 1000)
  const rhoMax=(()=>{
    const span=Math.log10(rawMax)-Math.log10(rhoMin);
    return span>=minDecadeSpan ? rawMax : rhoMin*Math.pow(10,minDecadeSpan);
  })();
  const rhoX=(r)=>{
    const lf=Math.log10(Math.max(r,0.1));
    const l0=Math.log10(rhoMin); const l1=Math.log10(rhoMax);
    return PAD_LEFT+COL_W+4 + ((lf-l0)/(l1-l0||1))*(RHO_TRACK-8);
  };

  /* ── build SVG ── */
  let defs=`<defs>
    <pattern id="hatch-amb" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="hatch-pur" patternUnits="userSpaceOnUse" width="6" height="6">
      <line x1="0" y1="3" x2="6" y2="3" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.45"/>
    </pattern>
    <pattern id="hatch-grn" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="2" cy="2" r="1.2" fill="#00c853" opacity="0.55"/>
      <circle cx="6" cy="6" r="1.2" fill="#00c853" opacity="0.55"/>
    </pattern>
    <pattern id="hatch-red" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ff4d4d" stroke-width="2" stroke-opacity="0.4"/>
      <line x1="3" y1="0" x2="3" y2="6" stroke="#ff4d4d" stroke-width="2" stroke-opacity="0.4"/>
    </pattern>
    <pattern id="hatch-blu" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1.5" fill="#38bdf8" opacity="0.5"/>
    </pattern>
    <clipPath id="col-clip">
      <rect x="${PAD_LEFT}" y="${PAD_TOP}" width="${COL_W}" height="${SVG_H-PAD_TOP-PAD_BOT}"/>
    </clipPath>
  </defs>`;

  let colBody="";
  let rhoLog="";
  let depthTicks="";
  let layerGroups="";

  /* ── depth tick marks & grid ── */
  const nTicks=8;
  for(let i=0;i<=nTicks;i++){
    const d=(totalVis*i/nTicks);
    const y=depthScale(d);
    depthTicks+=`<line x1="${PAD_LEFT-4}" y1="${y}" x2="${PAD_LEFT+COL_W+RHO_TRACK+10}" y2="${y}" stroke="#0f2830" stroke-width="1"/>
      <line x1="${PAD_LEFT-8}" y1="${y}" x2="${PAD_LEFT-4}" y2="${y}" stroke="#5a7f88" stroke-width="1"/>
      <text x="${PAD_LEFT-12}" y="${y+3.5}" text-anchor="end" fill="#5a7f88" font-size="9" font-family="'IBM Plex Mono',monospace">${d.toFixed(0)}</text>`;
  }

  /* ── layer segments ── */
  let rhoPoints=""; // for the step-log polyline
  layers.forEach((l,i)=>{
    const yTop=depthScale(l.top);
    const yBase=l.base!==null?depthScale(l.base):depthScale(l.top+halfSpaceVis);
    /* FIX: track real pixel height separately; clamp to min=2 only for stroke */
    const rawH=yBase-yTop;
    const h=Math.max(rawH,2);
    const clr=clrMap[l.cls]||"#5a7f88";
    const pat=patMap[l.cls]||null;
    const midY=yTop+rawH/2; // true geometric midpoint
    /* FIX: only show badge+label when layer renders tall enough (>=16px) */
    const BADGE_MIN_H=16;
    const showBadge=rawH>=BADGE_MIN_H;
    /* FIX: clamp badge y so it never escapes its own layer bounds */
    const badgeY=Math.min(Math.max(midY-7,yTop+1),yBase-13);

    /* segment rectangle + hatch fill overlay */
    const segId=`seg-${i}`;
    layerGroups+=`
    <g class="bh-layer-seg" id="${segId}" onclick="bhSelectLayer(${i})">
      <rect class="seg-fill" x="${PAD_LEFT}" y="${yTop}" width="${COL_W}" height="${h}"
        fill="${clr}" fill-opacity="0.28" stroke="${clr}" stroke-width="1" rx="0"/>
      ${pat?`<rect x="${PAD_LEFT}" y="${yTop}" width="${COL_W}" height="${h}" fill="url(#${pat})" clip-path="url(#col-clip)"/>`:``}
      ${showBadge
        ?`<rect x="${PAD_LEFT+2}" y="${badgeY}" width="16" height="14" fill="${clr}" fill-opacity="0.9" rx="2"/>
      <text x="${PAD_LEFT+10}" y="${badgeY+10}" text-anchor="middle" fill="#070d0f" font-size="8.5" font-weight="700" font-family="'IBM Plex Mono',monospace">${l.n}</text>
      <text x="${PAD_LEFT+22}" y="${badgeY+10}" fill="${clr}" font-size="8" font-family="'IBM Plex Mono',monospace" clip-path="url(#col-clip)">${l.name.length>10?l.name.slice(0,9)+"...":l.name}</text>`
        :`<line x1="${PAD_LEFT-2}" y1="${midY}" x2="${PAD_LEFT+8}" y2="${midY}" stroke="${clr}" stroke-width="1.5" opacity="0.9"/>
      <text x="${PAD_LEFT-4}" y="${midY+3.5}" text-anchor="end" fill="${clr}" font-size="7.5" font-weight="700" font-family="'IBM Plex Mono',monospace">${l.n}</text>`}
    </g>`;

    /* aquifer casing/screen overlay */
    if(l.target==="AQUIFER"){
      /* screen slots on borehole wall */
      for(let sy=yTop;sy<yBase-4;sy+=6){
        layerGroups+=`<line x1="${PAD_LEFT}" y1="${sy+3}" x2="${PAD_LEFT+6}" y2="${sy+3}" stroke="#00c853" stroke-width="1.5" opacity="0.9"/>
          <line x1="${PAD_LEFT+COL_W-6}" y1="${sy+3}" x2="${PAD_LEFT+COL_W}" y2="${sy+3}" stroke="#00c853" stroke-width="1.5" opacity="0.9"/>`;
      }
      /* screen label */
      layerGroups+=`<text x="${PAD_LEFT+COL_W/2}" y="${midY+4}" text-anchor="middle" fill="#00c853" font-size="7.5" font-weight="700" font-family="'IBM Plex Mono',monospace">SCREEN</text>`;
    }

    /* rho log step line */
    const rx=rhoX(l.res);
    if(i===0){
      rhoPoints=`M${rx},${yTop}`;
    } else {
      /* vertical step from previous layer's x to this x */
      const prevRx=rhoX(layers[i-1].res);
      rhoPoints+=` L${prevRx},${yTop} L${rx},${yTop}`;
    }
    rhoPoints+=` L${rx},${yBase}`;
  });

  /* rho axis ticks (log) */
  let rhoAxisTicks="";
  const rhoDecades=[1,10,100,1000,10000];
  rhoDecades.forEach(v=>{
    if(v>=rhoMin*0.8&&v<=rhoMax*1.2){
      const rx=rhoX(v);
      rhoAxisTicks+=`<line x1="${rx}" y1="${PAD_TOP-8}" x2="${rx}" y2="${SVG_H-PAD_BOT+4}" stroke="#0f2830" stroke-width="1"/>
        <text x="${rx}" y="${PAD_TOP-12}" text-anchor="middle" fill="#5a7f88" font-size="8" font-family="'IBM Plex Mono',monospace">${v>=1000?(v/1000)+"k":v}</text>`;
    }
  });

  /* casing line (top to aquifer top) */
  const casingBase=depthScale(layers.find(l=>l.target==="AQUIFER")?.top||finalDepth);
  colBody+=`
    <!-- casing lines -->
    <line x1="${PAD_LEFT+3}" y1="${PAD_TOP}" x2="${PAD_LEFT+3}" y2="${casingBase}" stroke="#5a7f88" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="${PAD_LEFT+COL_W-3}" y1="${PAD_TOP}" x2="${PAD_LEFT+COL_W-3}" y2="${casingBase}" stroke="#5a7f88" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- borehole wall outlines -->
    <rect x="${PAD_LEFT}" y="${PAD_TOP}" width="${COL_W}" height="${SVG_H-PAD_TOP-PAD_BOT}" fill="none" stroke="#1a3540" stroke-width="1.5"/>`;

  /* total depth arrow & label */
  const arrowY=SVG_H-PAD_BOT+18;
  const recoDeptPx=depthScale(50);
  colBody+=`
    <line x1="${PAD_LEFT+COL_W/2}" y1="${recoDeptPx-2}" x2="${PAD_LEFT+COL_W/2}" y2="${recoDeptPx+10}" stroke="#00e5b0" stroke-width="2" marker-end="url(#arr)"/>
    <text x="${PAD_LEFT+COL_W+6}" y="${recoDeptPx+5}" fill="#00e5b0" font-size="8" font-family="'IBM Plex Mono',monospace">TD=50m</text>`;

  defs+=`<marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#00e5b0"/></marker>`;

  /* axis labels */
  const axisLabels=`
    <text x="${PAD_LEFT-26}" y="${PAD_TOP-16}" fill="#5a7f88" font-size="9" font-family="'IBM Plex Mono',monospace" text-anchor="middle" transform="rotate(-90,${PAD_LEFT-26},${(PAD_TOP+SVG_H-PAD_BOT)/2})">DEPTH (m)</text>
    <text x="${PAD_LEFT+COL_W/2}" y="${PAD_TOP-20}" fill="#00e5b0" font-size="9" font-weight="700" font-family="'IBM Plex Mono',monospace" text-anchor="middle">BOREHOLE</text>
    <text x="${PAD_LEFT+COL_W+RHO_TRACK/2+4}" y="${PAD_TOP-20}" fill="#5a7f88" font-size="9" font-family="'IBM Plex Mono',monospace" text-anchor="middle">ρ (Ω·m) →</text>`;

  /* ── assemble SVG ── */
  const svg=`<svg viewBox="0 0 ${SVG_W} ${SVG_H}" width="${SVG_W}" height="${SVG_H}" xmlns="http://www.w3.org/2000/svg" style="background:transparent">
    ${defs}
    ${depthTicks}
    ${rhoAxisTicks}
    ${colBody}
    ${layerGroups}
    <!-- rho step log -->
    <path d="${rhoPoints}" fill="none" stroke="#00e5b0" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>
    <!-- rho log fill -->
    <path d="${rhoPoints} L${rhoX(layers[layers.length-1].res)},${SVG_H-PAD_BOT} L${PAD_LEFT+COL_W+4},${SVG_H-PAD_BOT} Z" fill="#00e5b0" fill-opacity="0.07"/>
    ${axisLabels}
  </svg>`;

  wrap.innerHTML=svg;
}

/* IX1D detail panel on layer click */
function bhSelectLayer(idx){
  const l=S.vesLayers[idx];
  if(!l) return;
  /* compute cumulative depth */
  let cum=0;
  for(let i=0;i<idx;i++) if(S.vesLayers[i].thick) cum+=S.vesLayers[i].thick;
  const topD=cum.toFixed(1);
  const baseD=l.thick?(cum+l.thick).toFixed(1):"∞ (half-space)";

  /* remove previous active */
  document.querySelectorAll(".bh-layer-seg").forEach(g=>g.classList.remove("active"));
  const seg=document.getElementById(`seg-${idx}`);
  if(seg) seg.classList.add("active");

  const clrMap={amb:"#f5a623",pur:"#c084fc",grn:"#00c853",red:"#ff4d4d",blu:"#38bdf8",org:"#fb923c"};
  const clr=clrMap[l.cls]||"#5a7f88";

  /* rho log-position for bar marker */
  const allRho=S.vesLayers.map(x=>x.res);
  const rhoMin=Math.min(...allRho)*0.5; const rhoMax=Math.max(...allRho)*1.5;
  const pct=((Math.log10(l.res)-Math.log10(rhoMin))/(Math.log10(rhoMax)-Math.log10(rhoMin)))*100;

  const panel=document.getElementById("bh-info-panel");
  if(!panel) return;

  const hazard=l.res<10?"⚠ Very low — possible saline or clay":
    l.res<30?"Low — clay/weathered zone":
    l.res<80?"Moderate — partly saturated":
    l.res<300?"Moderate-high — fractured/aquifer zone":
    l.res<1500?"High — hard rock / dry":
    "Very high — competent basement";

  panel.innerHTML=`
    <div class="bh-detail-header">Layer ${l.n} — ${l.name}</div>
    <div class="bh-detail-row">
      <span class="bh-detail-label">Depth Top</span>
      <span class="bh-detail-val" style="color:var(--blu)">${topD} m</span>
    </div>
    <div class="bh-detail-row">
      <span class="bh-detail-label">Depth Base</span>
      <span class="bh-detail-val" style="color:var(--blu)">${baseD}</span>
    </div>
    <div class="bh-detail-row">
      <span class="bh-detail-label">Thickness</span>
      <span class="bh-detail-val" style="color:var(--acc)">${l.thick?l.thick+" m":"∞"}</span>
    </div>
    <div class="bh-detail-row">
      <span class="bh-detail-label">Resistivity</span>
      <span class="bh-detail-val" style="color:${clr}">${l.res.toLocaleString()} Ω·m</span>
    </div>
    <div class="bh-rho-bar-wrap">
      <div class="bh-rho-bar-label">Resistivity Range Position</div>
      <div class="bh-rho-bar" style="position:relative">
        <div class="bh-rho-marker" style="left:${Math.min(100,Math.max(0,pct))}%"></div>
      </div>
      <div class="bh-rho-val">${hazard}</div>
    </div>
    <div class="bh-detail-row" style="margin-top:10px">
      <span class="bh-detail-label">Density</span>
      <span class="bh-detail-val" style="color:var(--pur)">${l.dens} g/cm³</span>
    </div>
    <div class="bh-detail-row">
      <span class="bh-detail-label">Geology</span>
      <span class="bh-detail-val" style="color:${clr};font-size:11px">${l.lbl}</span>
    </div>
    ${l.target?`<div style="margin-top:12px;padding:10px;background:rgba(0,200,83,.08);border:1px solid rgba(0,200,83,.3);border-radius:4px;font-size:11px;color:#00c853;font-family:monospace;letter-spacing:1px">★ ${l.target} — Primary drilling target</div>`:""}
    <div class="bh-geo-bar" style="background:${clr};opacity:0.3;margin-top:14px"></div>
    <div style="font-size:9px;color:var(--mut);font-family:monospace;letter-spacing:1px">Scroll column · click layers to compare</div>`;
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
render();
</script>
</body>
</html>
